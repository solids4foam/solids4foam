# Build and test solids4foam against selected PETSc versions.
#
# This workflow is manual only because building PETSc and its external packages
# for every version is too expensive for the pull-request matrix.
name: Build and test PETSc versions (manual)

on:
  workflow_dispatch:
    inputs:
      petsc-versions:
        description: "JSON array of exact PETSc versions to test"
        required: true
        default: '["3.15.5","3.18.6","3.21.6","3.23.7","3.24.6"]'
        type: string
      run-regression-tests:
        description: "Also run Alltest-regression (slower)"
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    name: PETSc-${{ matrix.petsc-version }} with OpenFOAM-v2512
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        petsc-version: ${{ fromJSON(inputs.petsc-versions) }}
    env:
      PETSC_VERSION: ${{ matrix.petsc-version }}
      PETSC_PREFIX: /tmp/petsc-${{ matrix.petsc-version }}
      OPENFOAM_BASHRC: /usr/lib/openfoam/openfoam2512/etc/bashrc

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenFOAM-v2512 and PETSc build dependencies
        shell: bash {0}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl git gnupg gfortran python3
          curl -fsSL https://dl.openfoam.com/pubkey.gpg \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/openfoam.gpg
          echo "deb [arch=amd64] https://dl.openfoam.com/repos/deb jammy main" \
            | sudo tee /etc/apt/sources.list.d/openfoam.list
          sudo apt-get update
          sudo apt-get install -y openfoam2512-default
          dpkg -l | grep openfoam2512

      - name: Restore PETSc installation
        id: petsc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PETSC_PREFIX }}
          key: petsc-v1-ubuntu-22.04-${{ matrix.petsc-version }}-mumps-hypre

      - name: Build PETSc-${{ matrix.petsc-version }}
        if: steps.petsc-cache.outputs.cache-hit != 'true'
        shell: bash {0}
        run: |
          source "${OPENFOAM_BASHRC}"
          set -eo pipefail

          source_dir="${RUNNER_TEMP}/petsc-src-${PETSC_VERSION}"
          git clone --branch "v${PETSC_VERSION}" --depth 1 \
            https://gitlab.com/petsc/petsc.git "${source_dir}"
          cd "${source_dir}"

          export PETSC_ARCH=arch-ci
          ./configure \
            --prefix="${PETSC_PREFIX}" \
            --with-debugging=0 \
            --with-shared-libraries=1 \
            --with-cc=mpicc \
            --with-cxx=mpicxx \
            --with-fc=mpif90 \
            --with-mpi=1 \
            --with-openmp=0 \
            --download-fblaslapack \
            --download-scalapack \
            --download-mumps \
            --download-hypre
          make PETSC_DIR="${source_dir}" PETSC_ARCH="${PETSC_ARCH}" \
            -j"$(nproc)" all
          make PETSC_DIR="${source_dir}" PETSC_ARCH="${PETSC_ARCH}" install

      - name: Check PETSc configuration
        shell: bash -l {0}
        run: |
          source "${OPENFOAM_BASHRC}"
          set -eo pipefail
          export PETSC_DIR="${PETSC_PREFIX}"
          unset PETSC_ARCH
          export LD_LIBRARY_PATH="${PETSC_DIR}/lib:${LD_LIBRARY_PATH:-}"

          petsc_state="$(./etc/check-petsc.sh)"
          petsc_version=$(awk \
            '$1 == "#define" && $2 == "PETSC_VERSION_MAJOR" { major=$3 }
             $1 == "#define" && $2 == "PETSC_VERSION_MINOR" { minor=$3 }
             $1 == "#define" && $2 == "PETSC_VERSION_SUBMINOR" { patch=$3 }
             END { print major "." minor "." patch }' \
            "${PETSC_DIR}/include/petscversion.h")

          echo "${petsc_state}"
          {
            echo "## PETSc ${petsc_version}"
            echo
            echo "- OpenFOAM: v2512"
            echo "- MUMPS: enabled"
            echo "- HYPRE: enabled"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Allwmake
        shell: bash -l {0}
        run: |
          source "${OPENFOAM_BASHRC}"
          set -eo pipefail
          export PETSC_DIR="${PETSC_PREFIX}"
          unset PETSC_ARCH
          export LD_LIBRARY_PATH="${PETSC_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export S4F_NO_FILE_FIXES=1
          ./Allwmake -j

      - name: Alltest
        shell: bash -l {0}
        run: |
          source "${OPENFOAM_BASHRC}"
          set -eo pipefail
          export PETSC_DIR="${PETSC_PREFIX}"
          unset PETSC_ARCH
          export LD_LIBRARY_PATH="${PETSC_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          mkdir -p petsc-version-test-logs
          (cd tutorials && ./Alltest) \
            2>&1 | tee petsc-version-test-logs/log.Alltest

      - name: Test MUMPS and HYPRE through solids4foam
        shell: bash -l {0}
        run: |
          source "${OPENFOAM_BASHRC}"
          set -eo pipefail
          export PETSC_DIR="${PETSC_PREFIX}"
          unset PETSC_ARCH
          export LD_LIBRARY_PATH="${PETSC_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1

          test_root="${RUNNER_TEMP}/petsc-targeted-tests"
          log_root="${GITHUB_WORKSPACE}/petsc-version-test-logs"
          mkdir -p "${test_root}" "${log_root}"

          run_targeted_case()
          {
            local package="$1"
            local case_dir="${test_root}/wobblyNewton-${package}"

            rm -rf "${case_dir}"
            cp -a tutorials/solids/linearElasticity/wobblyNewton "${case_dir}"
            sed -E -i \
              's/^([[:space:]]*endTime[[:space:]]+).*/\1 0.01;/' \
              "${case_dir}/system/controlDict"
            sed -E -i \
              "s|^[[:space:]]*optionsFile[[:space:]]+petscOptions\.mf\.hypre;|    optionsFile petscOptions.${package};|" \
              "${case_dir}/constant/solidProperties"
            # Exercise the selected linear solver without making this package
            # capability check depend on the tutorial's Newton line search.
            sed -i 's/^-snes_type newtonls$/-snes_type ksponly/' \
              "${case_dir}/petscOptions.${package}"

            (cd "${case_dir}" && ./Allrun) \
              2>&1 | tee "${log_root}/log.wobblyNewton.${package}.Allrun"
            cp "${case_dir}/log.solids4Foam" \
              "${log_root}/log.wobblyNewton.${package}.solids4Foam"
            grep -Eq '^[[:space:]]*End[[:space:]]*$' \
              "${case_dir}/log.solids4Foam"
          }

          run_targeted_case mumps
          run_targeted_case hypre

      - name: Alltest-regression
        if: ${{ inputs.run-regression-tests }}
        shell: bash -l {0}
        run: |
          source "${OPENFOAM_BASHRC}"
          set -eo pipefail
          export PETSC_DIR="${PETSC_PREFIX}"
          unset PETSC_ARCH
          export LD_LIBRARY_PATH="${PETSC_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          ./tutorials/Alltest-regression -j

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: petsc-${{ matrix.petsc-version }}-failure-logs
          path: |
            **/log.Allwmake
            petsc-version-test-logs
            tutorialsTest/logs
            tutorialsTest-regression
            ${{ runner.temp }}/petsc-src-${{ matrix.petsc-version }}/arch-ci/lib/petsc/conf/configure.log
          retention-days: 10
