name: Check Tutorial READMEs

on:
  workflow_dispatch:
  pull_request:

# The GITHUB_TOKEN is only needed to read the repository
permissions:
  contents: read

jobs:
  check-tutorial-readmes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tutorial README.md files
        run: ./.github/scripts/checkTutorialReadmes.sh
