name: Check Tutorial Regression Scripts

on:
  workflow_dispatch:
  pull_request:

jobs:
  check-tutorial-regression-scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tutorial regressionTest.sh scripts
        id: check-regression-scripts
        continue-on-error: true
        run: ./.github/scripts/checkTutorialRegressionScripts.sh

      - name: Report advisory result
        if: steps.check-regression-scripts.outcome == 'failure'
        run: |
          echo "::warning::Some tutorial cases are missing regressionTest.sh files. This check is advisory only."
