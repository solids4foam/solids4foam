# Build the base Docker images that the CI workflows and the solids4foam
# release images (.docker/Dockerfile.*) are built on: OpenFOAM, then PETSc,
# then Gmsh, each layer on top of the previous one. See .docker/base/README.md.
#
# On a pull request that changes .docker/base, the images are only built, to
# check that the Dockerfiles still work. They are pushed to Docker Hub only
# when the workflow is run manually with "push" ticked; the DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN secrets must then have push access to the repository.
name: Docker base images

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to Docker Hub"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - ".docker/base/**"
      - ".github/workflows/docker-base-images.yml"

# Only the checkout needs the GITHUB_TOKEN; Docker Hub uses its own secrets
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image.repository }}:${{ matrix.image.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        image:
          - repository: "philippic/openfoam-v2512"
            tag: "ubuntu-24.04"
            dockerfile: ".docker/base/Dockerfile.openfoamv2512-ubuntu24.04"

    env:
      BASE_IMAGE: ${{ matrix.image.repository }}:${{ matrix.image.tag }}
      PETSC_IMAGE: ${{ matrix.image.repository }}:${{ matrix.image.tag }}-petsc-no-openmp-system-blas
      GMSH_IMAGE: ${{ matrix.image.repository }}:${{ matrix.image.tag }}-petsc-no-openmp-system-blas-gmsh

    steps:
      - uses: actions/checkout@v4

      # The three layers together approach the free disk space of a runner
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL
          df -h /

      # Plain "docker build", without buildx, so that each layer is in the
      # local image store for the next one to build on
      - name: Build the OpenFOAM image
        run: |
          docker build -t "${BASE_IMAGE}" \
              -f "${{ matrix.image.dockerfile }}" .docker/base

      - name: Build the PETSc image
        run: |
          docker build --build-arg BASE="${BASE_IMAGE}" -t "${PETSC_IMAGE}" \
              -f .docker/base/Dockerfile.petsc .docker/base

      - name: Build the Gmsh image
        run: |
          docker build --build-arg BASE="${PETSC_IMAGE}" -t "${GMSH_IMAGE}" \
              -f .docker/base/Dockerfile.gmsh .docker/base

      - name: Check the images
        run: |
          docker images
          docker run --rm "${GMSH_IMAGE}" bash -c \
              'source /usr/lib/openfoam/openfoam*/etc/bashrc; \
               set -e; echo "OpenFOAM-${WM_PROJECT_VERSION}"; \
               command -v simpleFoam; grep PRETTY /etc/os-release; \
               test -f "${PETSC_DIR}/lib/libpetsc.so"; gmsh --version'

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the images
        if: github.event_name == 'workflow_dispatch' && inputs.push
        run: |
          docker push "${BASE_IMAGE}"
          docker push "${PETSC_IMAGE}"
          docker push "${GMSH_IMAGE}"
