# Check formatting of markdown files
name: Markdown Lint

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run MarkdownLint
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18.0.0
        with:
          globs: "ThirdParty/**/*.md,tests/**/*.md,optionalFixes/**/*.md,tutorials/**/*.md,applications/**/*.md,CHANGELOG.md,CODE_OF_CONDUCT.md,CONTRIBUTING.md,CONTRIBUTORS.md,README.md,etc/**/*.md,src/**/*.md,.github/review/*.md,.github/pull_request_template.md,.agents/skills/**/*.md"
          separator: ','

  # The READMEs link to each other and to the tutorials with relative paths,
  # which break silently when a case is moved or renamed. They are also
  # published on www.solids4foam.com, where a broken link is a 404. Check them
  # offline; external URLs are skipped.
  relative-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check relative links in markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true
