# Check formatting of markdown files
name: Markdown Lint

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run MarkdownLint
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18.0.0
        with:
          globs: "ThirdParty/**/*.md,tests/**/*.md,optionalFixes/**/*.md,tutorials/**/*.md,applications/**/*.md,CHANGELOG.md,CONTRIBUTING.md,CONTRIBUTORS.md,README.md,etc/**/*.md,src/**/*.md,.github/review/*.md,.github/pull_request_template.md"
          separator: ','
